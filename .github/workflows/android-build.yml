name: Build Android Agent APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布到 Release（不勾选只编译，产物留在 Actions artifacts）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # 需要写权限才能创建 Release

env:
  VERSION: 1.1.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Validate Gradle Wrapper
        run: ./gradlew --version

      - name: Validate Python asset
        run: |
          echo "=== Tar info ==="
          ls -la app/src/main/assets/python-env.bin
          md5sum app/src/main/assets/python-env.bin
          echo "=== Python binary ELF header ==="
          tar xf app/src/main/assets/python-env.bin -O usr/bin/python3.13 | od -A x -t x1z -N 64

      - name: 📝 写入版本号与发布说明
        run: |
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"
          {
            echo 'CHANGES<<CHANGES_EOF'
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo 'CHANGES_EOF'
          } >> "$GITHUB_ENV"
          echo "版本号: ${VERSION}（CI 运行号 ${{ github.run_number }}）"

      - name: 🏗️ 构建 Debug APK
        run: |
          rm -rf ~/.gradle
          ./gradlew clean assembleDebug --no-daemon --stacktrace --no-build-cache

      - name: Validate APK content
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "=== APK size ==="
          ls -lh "$APK"
          echo "=== APK tar md5 ==="
          unzip -p "$APK" assets/python-env.bin | md5sum
          echo "=== APK Python binary ==="
          unzip -p "$APK" assets/python-env.bin | tar xf - -O usr/bin/python3.13 | od -A x -t x1z -N 64

      - name: 📦 重命名 APK
        run: |
          cd app/build/outputs/apk/debug
          mv app-debug.apk "android-agent_v${VERSION}.apk"

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-apk
          path: app/build/outputs/apk/debug/android-agent_v*.apk
          if-no-files-found: error

      - name: 🚀 发布到 GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Android Agent ${{ env.TAG }}
          body: |
            ${{ env.CHANGES }}

            ---
            - 版本: ${{ env.VERSION }}
            - 构建号: ${{ github.run_number }}
            - 提交: ${{ github.sha }}
          files: app/build/outputs/apk/debug/android-agent_v*.apk
          fail_on_unmatched_files: true
